<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111230">
<title>Tonic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Figtree:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: palco no topo (acorde gigante, luz muda com a função harmônica), loop de 4 compassos no meio, notas e abas embaixo. Tema único: palco à noite. */
:root{
  color-scheme: dark;
  --night:#111230; --panel:#1A1C44; --panel2:#24275C; --line:rgba(225,222,255,.10);
  --text:#F4EDDF; --dim:#A9A8D2; --faint:#6F6EA3;
  --tonic:#FFB23E; --sub:#38D1AE; --dom:#FF6B5E;
  --common:#BDBBDF; --rare:#69A9FF; --epic:#C38CFF; --legend:#F3E47E;
  --ink:#16122A;
  --display:'Shrikhand', Georgia, serif;
  --body:'Figtree', system-ui, -apple-system, sans-serif;
  --mono:'DM Mono', ui-monospace, Menlo, monospace;
  --fn:var(--tonic);
  --pop:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.2,.8,.2,1);
}
html,body{background:var(--night);color:var(--text)}
body{font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:0 56px;display:flex;flex-direction:column;gap:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:10px;background:linear-gradient(var(--night) 70%,transparent)}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.5px;margin-right:auto;color:var(--text)}
.stat{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:6px 12px 6px 8px;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;min-height:36px}
.stat svg{width:18px;height:18px}
.stat small{font-family:var(--body);color:var(--dim);font-size:12px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel)}
.iconbtn svg{width:20px;height:20px}

/* Palco */
.stage{position:relative;border-radius:28px;overflow:hidden;background:var(--panel);padding:16px 16px 14px;isolation:isolate}
.light{position:absolute;inset:-20% -10% 30%;z-index:-1;opacity:0;transition:opacity .6s var(--out);pointer-events:none}
.light.t{background:radial-gradient(60% 70% at 50% 0%,rgba(255,178,62,.45),transparent 70%)}
.light.s{background:radial-gradient(60% 70% at 50% 0%,rgba(56,209,174,.40),transparent 70%)}
.light.d{background:radial-gradient(60% 70% at 50% 0%,rgba(255,107,94,.45),transparent 70%)}
.light.on{opacity:1}
.stage-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.live{display:none;color:var(--dom);font-weight:500}
.stage.gig .live{display:inline}
.chord{display:grid;justify-items:center;padding-block:4px 6px}
.roman{font-family:var(--mono);font-size:18px;color:var(--fn);transition:color .3s}
.cname{font-family:var(--display);font-size:clamp(64px,22vw,104px);line-height:1.05;text-shadow:0 6px 30px rgba(0,0,0,.35)}
.cname.pop{animation:pop .28s var(--pop)}
@keyframes pop{from{transform:scale(.86);opacity:.5}to{transform:none;opacity:1}}
.fnchip{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--fn);transition:color .3s}

.kbd{position:relative;height:66px;margin-top:12px;display:flex;gap:3px}
.wk{flex:1;background:#E9E3F2;border-radius:0 0 8px 8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-family:var(--mono);font-size:12px;color:#77739A;transition:background .15s,color .15s,box-shadow .15s}
.bk{position:absolute;top:0;width:9%;height:58%;background:#1B1A33;border-radius:0 0 6px 6px;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-family:var(--mono);font-size:10px;color:transparent;transition:background .15s,color .15s}
.wk.lit{background:var(--fn);color:var(--ink);font-weight:500;box-shadow:0 0 18px var(--fn)}
.bk.lit{background:var(--fn);color:var(--ink);box-shadow:0 0 14px var(--fn)}
.wk.root,.bk.root{text-decoration:underline;text-underline-offset:3px}

.beats{display:flex;justify-content:center;gap:10px;margin-top:12px}
.beats i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .08s}
.beats i.on{background:var(--text)}
.band{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile{min-height:72px;border-radius:16px;background:var(--panel2);display:grid;justify-items:center;align-content:center;gap:4px;font-size:12px;color:var(--dim);position:relative}
.tile svg{width:28px;height:28px;color:var(--text)}
.tile .rar{width:6px;height:6px;border-radius:50%}
.tile.locked{background:transparent;border:1.5px dashed var(--line)}
.tile.locked svg{color:var(--faint)}
.tile.hit{animation:hit .22s var(--pop)}
@keyframes hit{0%{transform:scale(1)}40%{transform:scale(1.08);box-shadow:0 0 22px rgba(255,255,255,.18)}100%{transform:scale(1)}}

/* Loop */
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sec-head h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0;font-weight:800}
.sec-head .sp{margin-left:auto}
.info{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--faint);color:var(--dim);font-family:var(--mono);font-size:13px;display:grid;place-items:center;position:relative}
.info::after{content:"";position:absolute;inset:-8px}
.score{display:flex;align-items:baseline;gap:6px;margin-left:auto}
.score b{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.score small{color:var(--dim);font-size:12px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{position:relative;min-height:76px;border-radius:16px;background:var(--panel);display:grid;justify-items:center;align-content:center;gap:2px;overflow:hidden;border:2px solid transparent;transition:border-color .2s}
.slot .r{font-family:var(--mono);font-size:13px}
.slot .n{font-family:var(--display);font-size:26px;line-height:1.1}
.slot.now{border-color:var(--text)}
.slot .ph{position:absolute;left:0;bottom:0;height:3px;background:var(--text);width:0}
.slot:active{transform:scale(.97)}
.f0{color:var(--tonic)}.f1{color:var(--sub)}.f2{color:var(--dom)}
.combos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:30px}
.chip{font-size:12px;border-radius:999px;padding:6px 10px;border:1.5px solid var(--line);color:var(--dim);display:flex;gap:6px;align-items:center}
.chip.prog{border-color:transparent;background:var(--text);color:var(--ink);font-weight:800}
.chip .mono{font-size:11px;opacity:.8}

/* Notas */
.pills{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pill{border-radius:14px;background:var(--panel);padding:8px 2px 7px;display:grid;justify-items:center;gap:1px}
.pill .l{font-family:var(--display);font-size:20px;line-height:1.1}
.pill .c{font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.pill.bump{animation:hit .25s var(--pop)}

/* Abas */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);padding:4px;border-radius:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15}
.tab{min-height:44px;border-radius:12px;font-weight:800;font-size:14px;color:var(--dim);position:relative}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--text)}
.tab .dot{position:absolute;top:8px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--tonic)}
.panel{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ttl{font-weight:800;font-size:16px}
.sub{color:var(--dim);font-size:13px}
.btn{min-height:44px;padding:0 16px;border-radius:14px;background:var(--tonic);color:var(--ink);font-weight:800;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s var(--out)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn[disabled]{background:var(--panel2);color:var(--faint);cursor:default}
.btn .mono{font-size:13px}
.field{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fc{background:var(--panel);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px}
.fc .top{display:flex;justify-content:space-between;align-items:baseline}
.fc .r{font-family:var(--mono);font-size:14px}
.fc .fn{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.fc .n{font-family:var(--display);font-size:30px;line-height:1.1}
.fc .tones{font-family:var(--mono);font-size:13px;color:var(--dim)}
.fc.off .n{color:var(--faint)}
.cost{display:flex;gap:8px;font-family:var(--mono);font-size:12px;color:var(--dim);flex-wrap:wrap}
.cost .miss{color:var(--dom)}
.plist{display:flex;flex-direction:column;gap:2px}
.pl{display:flex;align-items:center;gap:10px;min-height:40px;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl .nm{font-weight:800}
.pl .rn{font-family:var(--mono);font-size:13px;color:var(--dim);margin-left:auto}
.pl.lock .nm{color:var(--faint)}
.pips{display:flex;gap:3px}
.pips i{width:10px;height:6px;border-radius:2px;background:var(--panel2)}
.pips i.on{background:currentColor}
.ico{width:44px;height:44px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;flex:none}
.ico svg{width:26px;height:26px}
.rarity{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.c0{color:var(--common)}.c1{color:var(--rare)}.c2{color:var(--epic)}.c3{color:var(--legend)}
.c3.shine{background:linear-gradient(90deg,var(--legend),#fff,var(--legend));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shine 2.4s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.vs{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 10px;font-size:13px;align-items:center}
.vs .h{font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.cof{width:100%;max-width:300px;margin:0 auto;display:block}
.scale{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.scale span{font-family:var(--mono);font-size:13px;padding:4px 8px;border-radius:8px;background:var(--panel2)}
.scale span.new{background:var(--sub);color:var(--ink)}

/* Folha, modal, aviso */
.scrim{position:fixed;inset:0;background:rgba(8,8,24,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .225s var(--out)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .225s var(--out);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--faint);margin:0 auto 12px}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick .slot{background:var(--panel2)}
.pick .slot[disabled]{opacity:.35}
.modal{position:fixed;left:50%;top:50%;z-index:42;width:min(360px,calc(100% - 32px));transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;background:var(--panel);border-radius:24px;padding:20px;transition:transform .225s var(--pop),opacity .195s var(--out);display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 64px);overflow:auto}
.modal.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.modal h3{font-family:var(--display);font-size:30px;margin:0;line-height:1.1;font-weight:400;text-wrap:balance}
.modal p{margin:0;color:var(--dim);line-height:1.5}
.modal .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800}
.judges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.judge{background:var(--panel2);border-radius:16px;padding:10px 6px;display:grid;justify-items:center;gap:2px;opacity:0;transform:rotateX(80deg);transition:transform .3s var(--pop),opacity .2s}
.judge.on{opacity:1;transform:none}
.judge .h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:800}
.judge b{font-family:var(--mono);font-size:24px;font-weight:500}
.judge small{font-family:var(--mono);font-size:12px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 60px));visibility:hidden;z-index:50;background:var(--text);color:var(--ink);font-weight:800;border-radius:999px;padding:10px 18px;transition:transform .225s var(--pop),visibility .225s;font-size:14px;white-space:nowrap}
.toast.on{transform:translate(-50%,0);visibility:visible}
.fly{position:fixed;z-index:30;font-family:var(--mono);font-size:13px;font-weight:500;pointer-events:none;color:var(--fn)}
.flash{position:fixed;inset:0;z-index:39;pointer-events:none;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.35),transparent 60%);opacity:0}
.flash.on{animation:flash .6s var(--out)}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

/* Abertura */
.start{position:fixed;inset:0;z-index:60;background:var(--night);display:grid;place-items:center;padding:24px;text-align:center}
.start .in{display:flex;flex-direction:column;align-items:center;gap:18px}
.start h1{font-family:var(--display);font-weight:400;font-size:84px;margin:0;line-height:1;background:linear-gradient(180deg,var(--tonic),var(--dom));-webkit-background-clip:text;background-clip:text;color:transparent}
.start .icons{display:flex;gap:14px;color:var(--dim)}
.start .icons svg{width:30px;height:30px}
.start .tag{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase}
.start .btn{min-height:52px;padding:0 28px;font-size:16px}
.start.out{animation:fade .3s var(--out) forwards}
@keyframes fade{to{opacity:0;visibility:hidden}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .fly{display:none}
}
</style>
</head>
<body>
<div class="start" id="start">
  <div class="in">
    <div class="tag">Prototype</div>
    <h1>Tonic</h1>
    <div class="icons" id="startIcons"></div>
    <button class="btn" id="startBtn">Start the band</button>
  </div>
</div>

<div class="wrap">
  <header class="hud">
    <div class="brand">Tonic</div>
    <div class="stat" aria-label="Tips"><svg viewBox="0 0 24 24" fill="none" stroke="var(--tonic)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.4-.9-1.4-1.4-2.5-1.4-1.5 0-2.6.8-2.6 2s1.1 1.7 2.6 2 2.6.8 2.6 2-1.1 2-2.6 2c-1.2 0-2.2-.6-2.6-1.5M12 6v1.8M12 16.2V18"/></svg><span id="tips">$0</span></div>
    <div class="stat" aria-label="Fans"><svg viewBox="0 0 24 24" fill="var(--dom)"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10z"/></svg><span id="fans">0</span></div>
    <button class="iconbtn" id="soundBtn" aria-label="Sound on"></button>
  </header>

  <section class="stage" id="stage">
    <div class="light t on"></div><div class="light s"></div><div class="light d"></div>
    <div class="stage-top"><span id="keyLabel">C major</span><span class="live" id="liveLabel">Live</span><span id="bpmLabel">92 BPM</span></div>
    <div class="chord">
      <div class="roman" id="roman">I</div>
      <div class="cname" id="cname">C</div>
      <div class="fnchip" id="fnchip">Tonic</div>
    </div>
    <div class="kbd" id="kbd"></div>
    <div class="beats" id="beats"><i></i><i></i><i></i><i></i></div>
    <div class="band" id="band"></div>
  </section>

  <section>
    <div class="sec-head"><h2>Loop</h2><button class="info" data-info="loop" aria-label="About the loop">i</button>
      <div class="score"><b id="score">0</b><small>harmony</small></div></div>
    <div class="slots" id="slots"></div>
    <div class="combos" id="combos"></div>
  </section>

  <section>
    <div class="sec-head"><h2>Notes</h2><button class="info" data-info="notes" aria-label="About notes">i</button></div>
    <div class="pills" id="pills"></div>
  </section>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="chords">Chords</button>
    <button class="tab" role="tab" data-tab="band">Band</button>
    <button class="tab" role="tab" data-tab="gigs">Gigs</button>
    <button class="tab" role="tab" data-tab="keys">Keys</button>
  </nav>
  <div class="panel" id="panel"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="sec-head"><h2 id="sheetTitle">Bar 1</h2></div><div class="pick" id="pick"></div></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<div class="flash" id="flash"></div>

<script id="core">
// ===== Regra pura: teoria, economia, pontuação =====
const DEG=['I','ii','iii','IV','V','vi','vii°'];
const MAJOR=[0,2,4,5,7,9,11];
const QUAL=['','m','m','','','m','dim'];
const FN=[0,1,0,1,2,0,2];
const FN_NAME=['Tonic','Subdominant','Dominant'];
const SHARP=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const FLAT=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const KEYS=[{pc:0,name:'C major',cost:0,fans:0},{pc:7,name:'G major',cost:250,fans:30},{pc:2,name:'D major',cost:1500,fans:150},{pc:5,name:'F major',cost:6000,fans:500}];
const TEMPOS=[92,100,108,116,124,132,140];
const TEMPO_COST=[60,200,600,2000,6000,20000];
const LEARN=[0,30,60,0,0,15,150];
const RB=[1,2.5,6,15];
const RN=['Common','Rare','Epic','Legendary'];
const INST=[
  {id:'guitar',name:'Acoustic Guitar',short:'Guitar',buy:0,tune:10,sig:[4,9,2,7,11]},
  {id:'drums',name:'Drum Kit',short:'Drums',buy:25,tune:15,sig:null},
  {id:'piano',name:'Electric Piano',short:'Piano',buy:150,tune:40,sig:[0,4,7]},
  {id:'flute',name:'Flute',short:'Flute',buy:400,tune:100,sig:[11,9,7]},
];
const RARE_NOTES=[30,120,400];
const RARE_TIPS=[400,4000,40000];
// força da passagem de acorde pra acorde (0-10). I/IV/V puxados das estatísticas do Hooktheory; resto é balanceamento.
const T=[
  [2,6,5,10,8,8,3],
  [4,2,4,6,10,5,5],
  [4,4,2,8,5,9,2],
  [10,5,4,2,9,6,5],
  [10,3,4,8,2,9,3],
  [7,7,5,10,8,2,3],
  [10,2,6,3,4,5,1],
];
const CADENCES=[
  {a:4,b:0,name:'Perfect cadence',pts:8},
  {a:3,b:0,name:'Plagal cadence',pts:5},
  {a:4,b:5,name:'Deceptive cadence',pts:6},
  {a:6,b:0,name:'Leading-tone resolution',pts:6},
];
const COMBOS=[
  {id:'three',name:'Three-Chord Trick',set:[0,3,4],needs:[]},
  {id:'axis',name:'Axis',seq:[0,4,5,3],needs:[5]},
  {id:'doowop',name:'Doo-Wop',seq:[0,5,3,4],needs:[5]},
  {id:'251',name:'Two-Five-One',sub:[1,4,0],needs:[1]},
  {id:'circle',name:'Circle',seq:[5,1,4,0],needs:[5,1]},

function keyMult(S){return 1+0.15*(S.keys.length-1)}
function tuneCost(i,it){return ladder(i.tune*Math.pow(1.55,it.q-1)*Math.pow(3,it.r))}

// violão: Karplus-Strong com afinação por allpass fracionário
const ksCache=new Map();

function pluck(m,t,v,si){

const OPEN={C:[48,52,55,60,64],Dm:[50,57,62,65],Em:[40,47,52,55,59,64],F:[41,48,53,57,60,65],G:[43,47,50,55,59,67],Am:[45,52,57,60,64],Bdim:[47,53,59,62],

    if(st===0)pluck(top[1],t,0.6,5);
    if(st%4===2){pluck(top[(st/2)%2],t,0.6,4+((st/2)%2));gh=true}
  }
  if(gh)at(t,()=>hit('guitar'));
  // bateria
  const dr=S.inst.drums;
  if(dr.own){let dh=false;const r=dr.r;
    if(st===0||st===8||(r>=2&&st===11)){kick(t,0.95);dh=true}
    if(st===4||st===12){if(!(r>=3&&b===3&&st===12)){snare(t,0.85);dh=true}}
    if(r>=1&&st%2===0)hat(t,st%4===0?0.9:0.6,r>=2&&st===14);
    if(r>=3&&(st===7||st===15)&&b!==3)snare(t,0.18);
    if(r>=3&&b===3&&st>=12){tom(t,0.8,[220,190,160,130][st-12]);dh=true}
    if(dh)at(t,()=>hit('drums'));
  }
  // piano
  const pi=S.inst.piano;
  if(pi.own){const r=pi.r,v=pianoVoice(d,S.key,r);let ph=false;
    const comp=r===0?{0:16}:r===1?{0:8,8:8}:{0:6,6:4,10:4,14:2};
    if(comp[st]){const dur=comp[st]*six*0.95;v.rh.forEach(m=>ep(m,t,dur,0.55));if(r>=1&&(st===0||(r===1&&st===8)))ep(v.lh,t,dur,0.6);ph=true}
    if(r>=3&&b===3&&st>=12){ep(v.rh[st-12]+12,t,six*0.9,0.4);ph=true}
    if(ph)at(t,()=>hit('piano'));
  }
  // flauta
  if(S.inst.flute.own){melody().filter(n=>n.s===s).forEach(n=>{flute(n.m,t,n.du*six*0.92,0.8);at(t,()=>hit('flute'))})}
}
function tick(){if(!ctx)return;while(nextT<ctx.currentTime+0.15){scheduleStep(step,nextT);nextT+=sixteenth();step=(step+1)%64}}
function startClock(){nextT=ctx.currentTime+0.12;step=0;events=[];if(timer)clearInterval(timer);timer=setInterval(tick,25);tick();requestAnimationFrame(frame)}
function frame(){
  if(ctx){const now=ctx.currentTime;events.sort((a,b)=>a.t-b.t);while(events.length&&events[0].t<=now)events.shift().f();
    const ph=document.querySelector('.slot.now .ph');if(ph)ph.style.width=Math.min(100,Math.max(0,(now-barStartT)/barDur*100))+'%'}
  requestAnimationFrame(frame);
}

function onBar(b,d,t){
  curBar=b;barStartT=t;barDur=sixteenth()*16;
  const fn=FN[d];document.documentElement.style.setProperty('--fn',['var(--tonic)','var(--sub)','var(--dom)'][fn]);
  document.querySelectorAll('.light').forEach((l,i)=>l.classList.toggle('on',i===fn));
  $('roman').textContent=DEG[d];const cn=$('cname');cn.textContent=chordName(d,S.key);cn.classList.remove('pop');void cn.offsetWidth;cn.classList.add('pop');
  $('fnchip').textContent=FN_NAME[fn];

function onLoop(t){
  const h=harmony(S.prog);const nw=h.combos.filter(c=>!S.found.includes(c.id));

  if(nw.length){const c=nw[0];S.found.push(c.id);const P=bandPower(S);S.fans+=5;S.tips+=20*P;sfx('discover');haptic(40);flash();

function startGig(id){

function finishGig(){
  const v=gig.venue,mine=gigStats(S).map(x=>Math.max(0,Math.min(10,x+(Math.random()-0.5)*0.6))),theirs=v.r.map(x=>Math.max(0,Math.min(10,x+(Math.random()-0.5)*0.6)));
  const a=mine.reduce((s,x)=>s+x,0),b=theirs.reduce((s,x)=>s+x,0),win=a>b,first=!S.gigs[v.id];
  let fans=0,tips=0;if(win){const m=first?1:0.5;fans=Math.round(v.win[0]*m);tips=Math.round(v.win[1]*m);S.fans+=fans;S.tips+=tips;S.gigs[v.id]=(S.gigs[v.id]||0)+1;applause(ctx.currentTime+0.05);haptic([30,40,30]);flash()}else{sfx('deny');haptic(60)}

  if(act==='tab'){tab=el.dataset.tab;renderPanel();document.querySelector('.tabs').scrollIntoView({behavior:reduced?'auto':'smooth'});return}
  if(act==='learn'){const d=+el.dataset.d,pcs=chordPcs(d,S.key),n=LEARN[d];if(!canPay(pcs,n)){sfx('deny');return}pcs.forEach(pc=>S.notes[pc]-=n);S.learned[d]=1;sfx('buy');haptic(25);toast(`${chordName(d,S.key)} learned`);renderAll();save();return}
  if(act==='buy'){const i=INST.find(x=>x.id===el.dataset.i);if(S.tips<i.buy){sfx('deny');return}S.tips-=i.buy;S.inst[i.id].own=1;sfx('buy');haptic(30);flash();toast(`${i.short} joins the band`);updateTimbre();renderAll();save();return}
  if(act==='tune'){const i=INST.find(x=>x.id===el.dataset.i),it=S.inst[i.id],c=tuneCost(i,it);if(S.tips<c){sfx('deny');return}S.tips-=c;it.q++;sfx('buy');haptic(15);updateTimbre();renderAll();save();return}
  if(act==='rarity'){const i=INST.find(x=>x.id===el.dataset.i),it=S.inst[i.id];
    if(i.sig){if(!canPay(i.sig,RARE_NOTES[it.r])){sfx('deny');return}i.sig.forEach(pc=>S.notes[pc]-=RARE_NOTES[it.r])}else{if(S.tips<RARE_TIPS[it.r]){sfx('deny');return}S.tips-=RARE_TIPS[it.r]}
    it.r++;it.q=1;melCache.k='';sfx('discover');haptic([20,30,40]);flash();toast(`${i.short} is now ${RN[it.r]}`);updateTimbre();renderAll();save();return}
  if(act==='tempo'){const c=TEMPO_COST[S.tempo];if(S.tips<c){sfx('deny');return}S.tips-=c;S.tempo++;sfx('buy');haptic(15);renderAll();save();return}
  if(act==='cheat'){S.tips+=5000;S.fans+=100;for(let i=0;i<12;i++)S.notes[i]+=300;sfx('buy');renderAll();save();return}
  if(act==='gig'){startGig(el.dataset.v);return}
  if(act==='key'){const pc=+el.dataset.k,k=KEYS.find(q=>q.pc===pc);if(!k)return;
    if(!S.keys.includes(pc)){if(S.fans<k.fans||S.tips<k.cost){sfx('deny');toast(S.fans<k.fans?`Needs ${k.fans} fans`:`Needs ${money(k.cost)}`);return}S.tips-=k.cost;S.keys.push(pc);sfx('buy');flash()}
    S.key=pc;melCache.k='';haptic(20);toast(`Now playing in ${k.name}`);renderAll();save();return}
});
$('scrim').addEventListener('click',closeAll);
$('soundBtn').addEventListener('click',()=>{muted=!muted;if(master)master.gain.setTargetAtTime(muted?0:0.85,ctx.currentTime,0.05);$('soundBtn').innerHTML=muted?ICON.off:ICON.on;$('soundBtn').setAttribute('aria-label',muted?'Sound off':'Sound on');haptic(8)});

// ===== Ausência =====
function offline(){
  const away=(Date.now()-(S.seen||Date.now()))/1000;if(away<30)return;
  const sec=Math.min(away,4*3600),bars=Math.floor(sec/(240/bpm(S)));if(bars<1)return;
  let tips=0;const got=Array(12).fill(0);
  let fans=0;for(let b=0;b<bars;b++){const d=S.prog[b%4],g=barGain(S,d);tips+=g.tips*0.5;fans+=g.fans*0.5;g.pcs.forEach(pc=>got[pc]+=g.notes*0.5)}
  S.tips+=tips;S.fans+=fans;got.forEach((n,pc)=>S.notes[pc]+=n);
  const mins=Math.round(sec/60);
  showModal(`<div class="eyebrow">While you were away</div><h3>${bars} bars played</h3><p class="mono" style="color:var(--text)">+${money(tips)} · ${scale(S.key).filter(pc=>got[pc]>0).map(pc=>'+'+num(got[pc])+' '+spell(pc,S.key)).join(' · ')}</p><p>${mins<60?mins+' min':(sec/3600).toFixed(1)+' h'}</p><button class="btn" data-act="close">Collect</button>`);
}
document.addEventListener('visibilitychange',()=>{
  if(!ctx)return;
  if(document.hidden){save();ctx.suspend()}else{offline();ctx.resume().then(()=>{nextT=ctx.currentTime+0.1;step=0;events=[]});renderAll()}
});

// ===== Início =====
function boot(data){
  S=(data&&data.S)||load();
  try{const t=localStorage.getItem('tonic.tab');if(t)tab=t}catch(e){}
  $('soundBtn').innerHTML=ICON.on;
  $('startIcons').innerHTML=INST.map(i=>ICON[i.id]).join('');
  buildKbd();renderAll();onBarStatic();
  $('startBtn').addEventListener('click',()=>{
    try{initAudio();ctx.resume()}catch(e){}
    $('start').classList.add('out');offline();haptic(20);
    if(ctx)startClock();
  },{once:true});
}
function onBarStatic(){const d=S.prog[0],pcs=chordPcs(d,S.key);$('roman').textContent=DEG[d];$('cname').textContent=chordName(d,S.key);$('fnchip').textContent=FN_NAME[FN[d]];
  document.querySelectorAll('#kbd [data-pc]').forEach(k=>{const pc=+k.dataset.pc;k.classList.toggle('lit',pcs.includes(pc));k.classList.toggle('root',pc===pcs[0])})}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
